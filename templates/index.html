<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elixire Assistant Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="w-full max-w-3xl p-6 bg-white rounded-2xl shadow-2xl flex flex-col border border-gray-300">
    
    <!-- Title -->
    <h1 class="text-4xl sm:text-5xl font-bold mb-6 text-center text-gray-800">
      Elixire Assistant
    </h1>

    <!-- Chat container -->
    <div id="chat-box" class="h-[500px] sm:h-[600px] overflow-y-auto flex flex-col gap-4 p-4 bg-gray-50 rounded-xl shadow-inner border border-gray-200">
      <!-- Messages will appear here -->
    </div>

    <!-- Input -->
    <form id="chat-form" class="flex mt-4" onsubmit="return false;">
      <input id="user-input" type="text" placeholder="Type your message..." 
             class="flex-1 p-4 rounded-l-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-1 text-lg"
             autocomplete="off" />
      <button id="send-btn" type="button" 
              class="bg-gray-700 text-white px-8 rounded-r-xl font-semibold hover:bg-gray-800 transition-all shadow-md">
        Send
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-box");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(sender, text, isUser) {
      const msg = document.createElement("div");
      msg.className = `transition-all duration-300 ease-out p-4 max-w-[85%] break-words shadow rounded-xl animate-fadeIn ${
        isUser 
          ? "self-end bg-gray-700 text-white font-medium text-lg" 
          : "self-start bg-gray-100 text-gray-800 font-medium border border-gray-200"
      }`;
      msg.innerHTML = `<strong>${sender}:</strong><br>${text}`;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendTypingIndicator() {
      const typing = document.createElement("div");
      typing.id = "typing-indicator";
      typing.className = "self-start p-4 rounded-xl max-w-[85%] bg-gray-200 text-gray-700 animate-pulse font-medium shadow-inner";
      typing.textContent = "Assistant is typing...";
      chatBox.appendChild(typing);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTypingIndicator() {
      const typing = document.getElementById("typing-indicator");
      if (typing) typing.remove();
    }

    function formatLLMOutput(text) {
      text = text.replace(/\x1b\[\d+m/g, "");
      text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

      const lines = text.split("\n");
      const formattedLines = [];
      let olOpen = false;

      lines.forEach(line => {
        const match = line.match(/^(\d+)\.\s+(.*)/);
        if (match) {
          if (!olOpen) {
            formattedLines.push("<ol class='list-decimal list-inside mb-2 pl-5 marker:text-gray-700'>");
            olOpen = true;
          }
          formattedLines.push(`<li>${match[2]}</li>`);
        } else {
          if (olOpen) {
            formattedLines.push("</ol>");
            olOpen = false;
          }
          if (line.toLowerCase().startsWith("tip:") || line.toLowerCase().startsWith("*tip")) {
            formattedLines.push(`<p class="italic text-gray-600 mt-2">${line}</p>`);
          } else if(line.trim() !== "") {
            formattedLines.push(`<p class="mt-1">${line}</p>`);
          }
        }
      });

      if (olOpen) formattedLines.push("</ol>");
      return formattedLines.join("");
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      appendMessage("You", message, true);
      input.value = "";
      sendBtn.disabled = true;
      appendTypingIndicator();

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await resp.json();
        removeTypingIndicator();
        sendBtn.disabled = false;

        if (data && data.success && data.answer) {
          appendMessage("Assistant", formatLLMOutput(data.answer), false);
        } else {
          const err = (data && data.error) ? data.error : "No response from server";
          appendMessage("Assistant", `Error: ${err}`, false);
        }
      } catch (err) {
        removeTypingIndicator();
        sendBtn.disabled = false;
        appendMessage("Assistant", "Error: Could not get response from server.", false);
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>

  <style>
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
  </style>
</body>
</html>
