<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elixire Assistant Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-purple-100 via-pink-50 to-yellow-50 flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="w-full max-w-xl p-6 bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl border border-purple-300 flex flex-col">
    
    <!-- Title -->
    <h1 class="text-4xl sm:text-5xl font-extrabold mb-6 text-center text-purple-700 drop-shadow-lg">
      ✨ Elixire Assistant ✨
    </h1>

    <!-- Chat container -->
    <div id="chat-box" class="h-[500px] sm:h-[600px] overflow-y-auto flex flex-col gap-4 p-4 bg-gradient-to-br from-purple-50 to-pink-50 rounded-2xl shadow-inner border border-purple-200">
      <!-- Messages will appear here -->
    </div>

    <!-- Input -->
    <form id="chat-form" class="flex mt-4" onsubmit="return false;">
      <input id="user-input" type="text" placeholder="Type your message..." 
             class="flex-1 p-4 rounded-l-2xl border border-purple-300 focus:outline-none focus:ring-2 focus:ring-pink-400 focus:ring-offset-1 text-lg shadow-inner"
             autocomplete="off" />
      <button id="send-btn" type="button" 
              class="bg-gradient-to-r from-purple-600 via-pink-500 to-yellow-400 text-white px-8 rounded-r-2xl font-semibold hover:scale-105 transform transition-all shadow-lg hover:shadow-2xl">
        Send
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-box");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(sender, text, isUser) {
      const msg = document.createElement("div");
      msg.className = `transition-all duration-300 ease-out p-4 max-w-[80%] break-words shadow-lg rounded-2xl animate-fadeIn ${
        isUser 
          ? "self-end bg-gradient-to-r from-purple-600 via-pink-500 to-yellow-400 text-white font-semibold text-lg shadow-xl" 
          : "self-start bg-white/90 text-purple-900 font-medium border border-purple-300 backdrop-blur-md"
      }`;
      msg.innerHTML = `<strong>${sender}:</strong><br>${text}`;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendTypingIndicator() {
      const typing = document.createElement("div");
      typing.id = "typing-indicator";
      typing.className = "self-start p-4 rounded-2xl max-w-[80%] bg-purple-200/80 text-purple-900 animate-pulse font-medium shadow-inner";
      typing.textContent = "Assistant is typing...";
      chatBox.appendChild(typing);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTypingIndicator() {
      const typing = document.getElementById("typing-indicator");
      if (typing) typing.remove();
    }

    function formatLLMOutput(text) {
      text = text.replace(/\x1b\[\d+m/g, "");
      text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

      const lines = text.split("\n");
      const formattedLines = [];
      let olOpen = false;

      lines.forEach(line => {
        const match = line.match(/^(\d+)\.\s+(.*)/);
        if (match) {
          if (!olOpen) {
            formattedLines.push("<ol class='list-decimal list-inside mb-2 pl-5 marker:text-purple-700'>");
            olOpen = true;
          }
          formattedLines.push(`<li>${match[2]}</li>`);
        } else {
          if (olOpen) {
            formattedLines.push("</ol>");
            olOpen = false;
          }
          if (line.toLowerCase().startsWith("tip:") || line.toLowerCase().startsWith("*tip")) {
            formattedLines.push(`<p class="italic text-purple-600 mt-2">${line}</p>`);
          } else if(line.trim() !== "") {
            formattedLines.push(`<p class="mt-1">${line}</p>`);
          }
        }
      });

      if (olOpen) formattedLines.push("</ol>");
      return formattedLines.join("");
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      appendMessage("You", message, true);
      input.value = "";
      sendBtn.disabled = true;
      appendTypingIndicator();

      try {
        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await resp.json();
        removeTypingIndicator();
        sendBtn.disabled = false;

        if (data && data.success && data.answer) {
          appendMessage("Assistant", formatLLMOutput(data.answer), false);
        } else {
          const err = (data && data.error) ? data.error : "No response from server";
          appendMessage("Assistant", `Error: ${err}`, false);
        }
      } catch (err) {
        removeTypingIndicator();
        sendBtn.disabled = false;
        appendMessage("Assistant", "Error: Could not get response from server.", false);
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>

  <style>
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
  </style>
</body>
</html>
