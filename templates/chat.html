{% extends "base.html" %}
{% block content %}

<div class="max-w-5xl mx-auto p-10 fade-in">

    <div class="glass-super rounded-3xl p-10 shadow-2xl">
        <h1 class="text-4xl font-bold text-center mb-3">Elixire Chatbot</h1>
        <p id="lang-display" class="text-center text-gray-300 mb-6 hidden"></p>

        <div id="chat-box"
             class="h-[600px] overflow-y-auto p-6 rounded-2xl bg-black/20 border border-white/10 space-y-4 shadow-inner">
        </div>

        <div class="flex mt-6">
            <input id="user-input"
                   class="flex-1 glass-input p-4 rounded-l-2xl text-white placeholder-gray-400 text-lg"
                   placeholder="Type your message..." />

            <button id="send-btn"
                    class="glass-btn px-10 py-4 rounded-r-2xl font-bold text-lg shadow-lg">
                Send
            </button>
        </div>
    </div>

</div>

<script src="/static/js/chat.js"></script>
{% endblock %}
