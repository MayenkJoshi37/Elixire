{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto glass p-8 rounded-2xl shadow-2xl fade-in">

    <h1 class="text-4xl font-bold text-center mb-6">Elixire Chatbot</h1>

    <p id="lang-display" class="text-center text-gray-300 mb-4 hidden"></p>

    <div id="chat-box"
         class="h-[500px] overflow-y-auto p-4 rounded-xl bg-gray-900/40 border border-gray-700 space-y-4">
    </div>

    <div class="flex mt-6">
        <input id="user-input" class="flex-1 bg-white/20 p-4 rounded-l-xl text-white placeholder-gray-300 focus:outline-none" placeholder="Ask me anything..." />
        <button id="send-btn" class="bg-white text-gray-900 px-8 font-semibold rounded-r-xl hover:bg-gray-200 transition">Send</button>
    </div>

</div>

<script src="/static/js/chat.js"></script>

{% endblock %}
