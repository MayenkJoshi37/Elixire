{% extends "base.html" %}
{% block content %}

<div class="max-w-4xl mx-auto glass p-8 rounded-3xl shadow-2xl fade-in mt-10">

    <h1 class="text-4xl font-bold text-center mb-4">Elixire Chatbot</h1>

    <p id="lang-display" class="text-center text-gray-300 mb-6 hidden text-lg"></p>

    <div id="chat-box"
         class="h-[550px] overflow-y-auto p-6 rounded-2xl bg-gray-900/40 border border-gray-700 space-y-4 shadow-inner">
    </div>

    <div class="flex mt-6">
        <input id="user-input"
        class="flex-1 glass-input p-4 rounded-l-2xl text-gray-900 placeholder-gray-500 text-lg"
        placeholder="Ask anything..." />

        <button id="send-btn"
                class="glass-btn px-10 py-4 rounded-r-2xl font-bold text-lg shadow-lg">
            Send
        </button>
    </div>

</div>

<script src="/static/js/chat.js"></script>
{% endblock %}
