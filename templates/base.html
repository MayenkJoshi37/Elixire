<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Elixire Assistant" }}</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="relative min-h-screen text-white">

    <!-- 🔥 Animated gradient background -->
    <div class="animated-bg"></div>

    <!-- NAVBAR -->
    <nav class="fixed top-0 w-full z-50 backdrop-blur-xl bg-black/20 border-b border-white/10">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-8 py-4">
            <h1 class="text-2xl font-bold tracking-wide">Elixire</h1>
            <div class="space-x-8 text-lg">
                <a href="/" class="hover:text-gray-300 transition-all">Home</a>
                <a href="/chatbot" class="hover:text-gray-300 transition-all">Chatbot</a>
            </div>
        </div>
    </nav>

    <main class="pt-28 relative z-20">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
