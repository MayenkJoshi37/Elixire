<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Elixire Assistant" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Smooth Animations -->
    <style>
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .glass {
            backdrop-filter: blur(14px);
            background: rgba(255,255,255,0.15);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 to-gray-700 text-white min-h-screen">

<nav class="flex justify-between px-8 py-4 items-center bg-gray-900/50 backdrop-blur-md fixed w-full top-0 z-10">
    <h1 class="text-2xl font-bold tracking-wide">Elixire</h1>

    <div class="space-x-6">
        <a href="/" class="hover:text-gray-300 transition">Home</a>
        <a href="/chatbot" class="hover:text-gray-300 transition">Chatbot</a>
    </div>
</nav>

<div class="pt-24">
    {% block content %}{% endblock %}
</div>

</body>
</html>
